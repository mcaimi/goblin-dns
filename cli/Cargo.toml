[package]
name = "goblin-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for Goblin DNS Redirector"

[[bin]]
name = "goblin-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
