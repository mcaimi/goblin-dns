[package]
name = "goblin"
version = "0.1.0"
edition = "2024"

[lib]
name = "goblin"
path = "src/lib.rs"

[[bin]]
name = "goblin"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"

# DNS
hickory-server = "0.26"
hickory-resolver = "0.26"
hickory-proto = "0.26"
hickory-net = "0.26"

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Networking
ipnetwork = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
